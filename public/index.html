<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新资讯</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>最新资讯</h1>
    <p class="tagline">十条最新报道 · 最新一条已高亮</p>
  </header>

  <main class="container">
    <section id="latest-featured" class="latest-featured" aria-label="最新一条资讯">
      <!-- Filled by JS: the single latest article -->
    </section>

    <section class="news-list" aria-label="十条最新资讯">
      <h2>全部十条最新</h2>
      <ul id="news-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>数据来自实时源，第一条为最新。每 5 分钟自动刷新。</p>
    <p id="update-status" class="update-status" aria-live="polite"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新资讯</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>最新资讯</h1>
    <p class="tagline">近一周头条 · 每页 15 条 · 最新一条已高亮</p>
  </header>

  <main class="container">
    <section id="latest-featured" class="latest-featured" aria-label="最新一条资讯">
      <!-- Filled by JS: the single latest article -->
    </section>

    <section class="news-list" aria-label="近一周头条">
      <ul id="news-list"></ul>
      <div id="pagination" class="pagination" aria-label="分页"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>数据来自实时源，第一条为最新。每 2 分钟自动刷新。标题已自动翻译为中文。</p>
    <p id="update-status" class="update-status" aria-live="polite"></p>
    <button type="button" id="btn-clear-cache" class="btn-clear-cache">清除缓存并重新加载</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
